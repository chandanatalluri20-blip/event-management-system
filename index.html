<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventEase - Home</title>

<!-- CSS -->
<style>
/* Reset and base styles */
body, html {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

/* Navbar */
.navbar {
    width: 100%;
    background-color: #333;
    overflow: hidden;
    display: flex;
    justify-content: space-around;
    position: fixed;
    top: 0;
    z-index: 100;
}

.navbar a {
    color: white;
    text-decoration: none;
    padding: 15px 20px;
    display: block;
    font-weight: bold;
}

.navbar a:hover, .navbar a.active {
    background-color: gold;
    color: black;
}

/* Hero Section using <img> */
.hero-container {
    position: relative;
    width: 100%;
    height: 100vh; /* Full viewport height */
    overflow: hidden;
    margin-top: 60px; /* to account for fixed navbar */
}

.hero-image {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Cover entire hero area */
    filter: blur(3px); /* Blur effect */
}

.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 20px;
}

.hero-overlay h1 {
    color: white;
    font-size: 48px;
    margin-bottom: 20px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}

.hero-overlay p {
    color: white;
    font-size: 24px;
    text-shadow: 1px 1px 6px rgba(0,0,0,0.6);
}

/* Responsive */
@media(max-width:768px){
    .hero-overlay h1 { font-size: 36px; }
    .hero-overlay p { font-size: 18px; }
    .navbar a { padding: 12px 10px; font-size: 14px; }
}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <a href="index.html" class="active">Home</a>
    <a href="about.html">About</a>
    <a href="event.html">Event</a>
    <a href="food.html">Food Menu</a>
    <a href="bill.html">Total Bill</a>
    <a href="contact.html">Contact</a>
</div>

<!-- Hero Section -->
<div class="hero-container">
    <img src="assests/home back.jpg" alt="Hero Image" class="hero-image">
    <div class="hero-overlay">
        <h1>Welcome to EventEase</h1>
        <p>Plan smarter, celebrate grander – your perfect event made effortless</p>
    </div>
</div>

<!-- JS -->
<script>
// Highlight active navbar link
const navbarLinks = document.querySelectorAll('.navbar a');
navbarLinks.forEach(link => {
    link.addEventListener('click', () => {
        navbarLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
    });
});
</script>

</body>
</html>
