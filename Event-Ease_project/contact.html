<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventEase - Contact</title>
<style>
body, html { margin: 0; padding: 0; font-family: Arial, sans-serif; height: 100%; }

/* Full-page blurred background */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('/assests/contact\ background.jpeg') no-repeat center center;
    background-size: cover;
    filter: blur(3px);
    z-index: -1;
}

/* Navbar */
.navbar {
    width: 100%;
    background-color: #333;
    display: flex;
    justify-content: space-around;
    position: fixed;
    top: 0;
    z-index: 100;
}
.navbar a { color: white; text-decoration: none; padding: 15px 20px; display: block; font-weight: bold; }
.navbar a:hover, .navbar a.active { background-color: gold; color: black; }

/* Hero Section */
.hero-container {
    position: relative;
    width: 100%;
    height: 40vh;
    margin-top: 60px;
    overflow: hidden;
}
.hero-image { display: none; } /* hide original image */
.hero-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
.hero-overlay h1 { color: white; font-size: 48px; text-shadow: 2px 2px 8px rgba(0,0,0,0.7); }

/* Contact Form */
.contact-container {
    max-width: 700px;
    margin: -30px auto 40px auto;
    padding: 30px;
    background-color: rgba(255,255,255,0.95);
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    text-align: center;
}
.contact-container h2 { margin-bottom: 20px; }

.contact-container input, .contact-container select, .contact-container textarea {
    width: 80%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 16px;
}
.contact-container button {
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    background-color: #333;
    color: white;
    font-weight: bold;
}
.contact-container button:hover { background-color: black; }

</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="event.html">Event</a>
    <a href="food.html">Food Menu</a>
    <a href="bill.html">Total Bill</a>
    <a href="contact.html" class="active">Contact</a>
</div>

<!-- Hero Section -->
<div class="hero-container">
    <img src="/assests/contact back.jpg" alt="Hero Image" class="hero-image">
    <div class="hero-overlay"><h1>Contact</h1></div>
</div>

<!-- Contact Form -->
<div class="contact-container">
    <h2>Contact Us</h2>
    <form id="contactForm">
        <input type="text" id="eventDate" placeholder="Event Date (dd/mm/yyyy)" required pattern="^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{2}$">
        <select id="eventTime" required>
            <option value="">Select Event Time</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="12:00 PM">12:00 PM</option>
            <option value="2:00 PM">2:00 PM</option>
            <option value="4:00 PM">4:00 PM</option>
            <option value="6:00 PM">6:00 PM</option>
            <option value="8:00 PM">8:00 PM</option>
        </select>
        <textarea id="userMessage" rows="5" placeholder="Enter your query here..." required></textarea>
        <br>
        <button type="submit">Submit</button>
    </form>
</div>

<script>
// Handle form submission
document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();

    const date = document.getElementById('eventDate').value;
    const time = document.getElementById('eventTime').value;
    const message = document.getElementById('userMessage').value;

    if(date && time && message){
        // Save contact details in localStorage
        localStorage.setItem('contactData', JSON.stringify({date, time, message}));

        alert('Your contact details have been submitted successfully!');
        // Clear the form
        this.reset();
    } else {
        alert('Please fill all fields correctly.');
    }
});
</script>

</body>
</html>
